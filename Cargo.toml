[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
hai-macros = { path = "crates/hai-macros" }

anyhow = "1"
tokio = { version = "1", features = ["full"] }
config = { version = "0.15", features = ["json", "toml"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

rmcp = { version = "2.0", default-features = false, features = ["client", "transport-child-process"] }
schemars = { version = "1", features = ["derive", "uuid1"] }
genai = "0.6"
agent-skills = "0.2"
teloxide = { version = "0.17", features = ["macros"] }
tracing = "0.1"
tracing-serde = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
base64 = "0.22"
reqwest = "0.13"
mime = "0.3"
arc-swap = "1.7"
derive_more = { version = "2", features = ["full"] }
jiff = { version = "0.2", features = ["serde"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid", "macros", "json"] }
jiff-sqlx = { version = "0.2", features = ["postgres"] }

uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
strum = { version = "0.28", features = ["derive"] }
struct-patch = "0.12"
toml = "1.0.4"
clap = { version = "4.5", features = ["derive", "color"] }
thiserror = "2.0.18"
rand = { version = "0.10" }
indexmap = { version = "2", features = ["serde"] }
futures = "0.3"
dirs = "6.0.0"
hound = "3.5"
linkify = "0.11"
sha2 = "0.10"
timeago = "0.6"
sanitize-filename = "0.6"
indicatif = "0.18"
ratatui = { version = "0.30", features = ["macros"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
which = "7"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = true
